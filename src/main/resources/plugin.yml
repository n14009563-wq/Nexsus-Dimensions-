name: NexusDimensions
version: '0.1.0'
main: com.nexus.dimensions.NexusDimensionsPlugin
api-version: '1.21'
author: RealSociety
description: Config-driven custom dimensions with fully custom terrain generation for Paper.
folia-supported: false

commands:
  nexusdim:
    description: Manage Nexus custom dimensions.
    usage: /nexusdim <list|create|tp|reload|portal>
    permission: nexusdimensions.admin

permissions:
  nexusdimensions.admin:
    description: Allows creating, loading, and managing Nexus dimensions.
    default: op
