# Tier 1 (instant, no restart) - true 3D terrain. terrain.mode: density3d
# means solid/air is a function of (x, y, z) instead of one height per
# column, which is what actually makes floating islands (plural, at
# different altitudes) and the overhangs/arches around their edges
# possible. See DESIGN.md section 4b and Density3DSampler.
#
# craters/caves are heightmap-only concepts and are ignored here on
# purpose - the holes and overhangs you'll see come from the same 3D
# noise that shapes the islands themselves, not a separate carving pass.
id: floating_isles
displayName: "Floating Isles"
environment: NORMAL
seed: 271828

terrain:
  mode: density3d
  seaLevel: 40           # now used - see density3d.liquids below and palette.liquidLevel
  baseHeight: 70          # only used as the implicit band's center if density3d.bands is empty - unused here since bands is set below
  noise:
    frequency: 0.018     # kept low-ish since this is now a per-block 3D evaluation, not per-column
    octaves: 3
    lacunarity: 2.0
    gain: 0.5
    ridged: false
    warp: 0.0
  density3d:
    # -0.1 was tuned numerically (see the build notes) against these exact
    # noise/band settings to give ~65-70% solid cores at each band's center
    # with clean air gaps between layers - 0.0 or higher reads as too
    # porous/swiss-cheese for what's meant to be walkable island ground.
    threshold: -0.1
    verticalFalloff: 0.02
    # An ocean far below the lowest island layer - genuinely new, see
    # DESIGN.md section 4c's liquids note. This is a flat per-block Y
    # threshold, not a flood fill: liquidLevel (40) sits comfortably below
    # the lowest band's floor (center 70, thickness 22 -> floor ~48), so
    # everything AIR-classified from there down to the world's minimum
    # height fills with water - reads as "a real ocean far below," not
    # scattered puddles, precisely because there's nothing but open air
    # down there for it to flood unevenly into.
    liquids: true
    bands:
      - center: 70          # solid ground layer near the bottom
        thickness: 22
      - center: 145         # a mid-altitude ring of islands
        thickness: 11
      - center: 210         # a sparser, thinner high layer
        thickness: 7

palette:
  surfaceBlock: minecraft:grass_block
  subsurfaceBlock: minecraft:dirt
  subsurfaceDepth: 4
  deepBlock: minecraft:stone
  liquidBlock: minecraft:water
  liquidLevel: 40

biomes:
  mode: single
  entries:
    - id: minecraft:windswept_hills
      weight: 1

trees:
  enabled: true
  minHeight: 12
  maxHeight: 28
  canopyRadius: 6
  trunkBlock: minecraft:oak_log
  leafBlock: minecraft:oak_leaves
  rarityPerChunk: 0.08
  giantCanopyLayers: 6

# Loose stone rubble on the island surfaces, plus the occasional chunk of
# rock hovering a few blocks up - the same alien-debris trick crystal_spires
# uses, here reading as a stray piece of a smaller island that broke apart.
decorations:
  enabled: true
  perChunkAttempts: 2
  chancePerAttempt: 0.2
  species:
    - name: "Loose Stone"
      weight: 2
      block: minecraft:cobblestone
      minHeight: 1
      maxHeight: 1
    - name: "Broken Fragment"
      weight: 1
      block: minecraft:stone
      minHeight: 1
      maxHeight: 1
      minFloatHeight: 2
      maxFloatHeight: 6

# Drifting mist between the island layers - vanilla CLOUD particles.
particles:
  enabled: true
  type: minecraft:cloud
  density: 8
  radius: 20
  heightSpread: 30
  intervalTicks: 6
  windStrength: 0.02

flavor:
  gravity: 0.6            # a little floaty - falling between islands is forgiving, not fatal
  alwaysClearWeather: true
  generateStructures: false
  generateDecorations: false
  generateVanillaCaves: false
