# Tier 1 (instant, no restart) - the "wilder terrain" + "beautiful trees"
# showcase preset: terrain.density3d.shape: spires (see DESIGN.md section
# 4c) instead of the plain band shape floating_isles.yml uses, giving thin
# persistent rock needles instead of horizontal island layers. The
# noise/band/spire numbers below are the EXACT values numerically sampled
# for DESIGN.md section 4c (single implicit band: center=baseHeight=100,
# thickness=heightVariation=40) - core columns sample ~67% solid across a
# wide height range, gaps between them ~3% solid, at this precise config.
# Changing noise.frequency/octaves or baseHeight/heightVariation means
# re-sampling rather than assuming these numbers still hold.
id: crystal_spires
displayName: "Crystal Spires"
environment: THE_END          # void-and-stars sky, no resource pack needed - see moon.yml
seed: 1618033

terrain:
  mode: density3d
  seaLevel: -200               # no liquid concept in density3d mode yet
  baseHeight: 100               # implicit band center (density3d.bands left empty on purpose - see header)
  heightVariation: 40            # implicit band thickness
  noise:
    frequency: 0.01
    octaves: 4
    lacunarity: 2.0
    gain: 0.5
    ridged: false
    warp: 0.0
  density3d:
    threshold: 0.0
    verticalFalloff: 0.02
    shape: spires
    spireFrequency: 0.02
    spireJitter: 0.9
    spireCoreFraction: 0.18
    spireStrength: 2.5

palette:
  surfaceBlock: minecraft:end_stone
  subsurfaceBlock: minecraft:purpur_pillar   # vertical grain by default - reads as columnar spire rock
  deepBlock: minecraft:end_stone
  subsurfaceDepth: 5
  liquidBlock: minecraft:air
  liquidLevel: -200
  # Dark obsidian patches breaking up the end stone - see DESIGN.md section 4c
  # for the threshold->coverage table this 0.15 comes from (~19% of columns).
  variants:
    - name: "dark_vein"
      surfaceBlock: minecraft:crying_obsidian
      subsurfaceBlock: minecraft:obsidian
      frequency: 0.02
      threshold: 0.15
  # Rare glowing pockets to find while exploring the spire interiors -
  # defaults from DESIGN.md section 4c (~2% of deep blocks).
  glowDeposits:
    - block: minecraft:glowstone
      frequency: 0.05
      threshold: 0.42

biomes:
  mode: single
  entries:
    - id: minecraft:the_end
      weight: 1

# One giant crystal-mossed tree species, rooted right on top of whichever
# spire the anchor chunk happens to land near - GroundHeightSource already
# handles "find the top of the nearest solid mass" correctly in density3d
# mode, no special-casing needed for trees on spire tops vs flat ground.
trees:
  enabled: true
  rarityPerChunk: 0.05
  minHeight: 40
  maxHeight: 90
  canopyRadius: 14
  trunkBlock: minecraft:warped_stem
  leafBlock: minecraft:azalea_leaves
  giantCanopyLayers: 10
  species:
    - name: "Amethyst Sentinel"
      weight: 1
      minHeight: 40
      maxHeight: 90
      canopyRadius: 14
      trunkBlock: minecraft:warped_stem
      leafBlock: minecraft:azalea_leaves
      giantCanopyLayers: 10
      branches: true
      buttressRoots: true
      canopyAccentBlock: minecraft:amethyst_cluster
      canopyAccentChance: 0.05
      trunkAccentBlock: minecraft:sea_lantern
      trunkAccentChance: 0.02
      vineBlock: minecraft:weeping_vines
      vineChance: 0.2
      vineMinLength: 3
      vineMaxLength: 8

# Crystal growths and drifting shards scattered around the spires -
# "Drifting Shard" is the one species in this whole scaffold that actually
# uses minFloatHeight/maxFloatHeight (see DESIGN.md section 5c), which
# reads especially well here since density3d terrain already has genuine
# open air between spires for something to convincingly hover in.
decorations:
  enabled: true
  perChunkAttempts: 3
  chancePerAttempt: 0.25
  species:
    - name: "Amethyst Shard"
      weight: 2
      block: minecraft:budding_amethyst
      minHeight: 1
      maxHeight: 3
      capBlock: minecraft:amethyst_cluster
    - name: "Drifting Shard"
      weight: 1
      block: minecraft:amethyst_block
      minHeight: 1
      maxHeight: 1
      minFloatHeight: 3
      maxFloatHeight: 10
    - name: "Crying Vein"
      weight: 1
      block: minecraft:crying_obsidian
      minHeight: 1
      maxHeight: 2

# Drifting motes between the spires - vanilla END_ROD particles read as
# faint glowing dust in this void sky, zero resource pack.
particles:
  enabled: true
  type: minecraft:end_rod
  density: 10
  radius: 16
  heightSpread: 20
  intervalTicks: 5
  windStrength: 0.02

flavor:
  gravity: 0.55          # slightly floaty - falling between spires is forgiving, not fatal
  alwaysClearWeather: true
  generateStructures: false
  generateDecorations: false
  generateVanillaCaves: false
