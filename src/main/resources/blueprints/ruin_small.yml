# Bundled default blueprint - a small ruined stone structure with one
# loot chest. Origin is one block above ground (dy: 0 = the floor layer,
# sitting directly on top of whatever terrain generated there).
#
# This is deliberately simple hand-authored data, not a schematic/NBT
# import - see StructurePopulator and DESIGN.md section 9 for the format.
# Copy this file to author your own; any org.bukkit.Material key works
# for `block`, and exactly one `loot: true` entry per structure is typical
# (more than one works too, each gets its own loot roll).
name: ruin_small
